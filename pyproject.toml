[project]
name = "draft1-ocr-pipeline"
version = "0.1.0"
description = "Car log book photo-to-Excel OCR automation pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
