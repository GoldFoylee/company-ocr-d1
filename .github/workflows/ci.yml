name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: draft1
          POSTGRES_PASSWORD: draft1_dev_password
          POSTGRES_DB: draft1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U draft1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Reject raw fixtures in the public repository
        run: scripts/check_no_raw_fixtures.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node for frontend integration test
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies (OpenCV)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app --ignore-missing-imports

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://draft1:draft1_dev_password@localhost:5432/draft1_test
        run: |
          alembic upgrade head
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Run live frontend health integration test
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/draft1-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/draft1-backend.log
              exit 1
            fi
            sleep 1
          done

          npm --prefix frontend run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Reject raw fixtures in the public repository
        run: scripts/check_no_raw_fixtures.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
